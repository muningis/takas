[project]
name = "takas"
version = "0.1.0"
description = "Local running-route generator for Vilnius"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/takas/static/fonts/OFL-*.txt"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "osmium>=4.3.1",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Repository = "https://github.com/muningis/takas"

[project.scripts]
takas = "takas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/takas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
